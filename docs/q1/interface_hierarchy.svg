<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">调度框架接口层级：公共框架、默认 Q1 实现与未来 Q3 扩展位置</title>
  <desc id="description">现有 Q1 调用兼容入口将问题定义注册后，选择一个后端供公共调度框架使用。公共框架只依赖四组协议：PlanSemantics、ExecutionModel、PredictionModel、ProposalSet。默认 Q1 后端包装现有算法。未来 Q3 仅预留注册位置，不会同时运行第二条管线或择优。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#455a76"/>
    </marker>
    <marker id="future-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c47216"/>
    </marker>
    <style>
      text {font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#183047}
      .title {font-size:36px;font-weight:700}
      .subtitle {font-size:21px;fill:#52657a}
      .section {font-size:25px;font-weight:700}
      .heading {font-size:23px;font-weight:700}
      .body {font-size:20px}
      .small {font-size:18px;fill:#536579}
      .code {font-family:Consolas,"Microsoft YaHei",monospace;font-size:19px}
      .public {fill:#f0f4f8;stroke:#526781;stroke-width:2}
      .q1 {fill:#e9f4fc;stroke:#2674af;stroke-width:2}
      .q1-module {fill:#f6fbff;stroke:#78a9cb;stroke-width:1.5}
      .future {fill:#fff5e8;stroke:#c47216;stroke-width:2.5;stroke-dasharray:10 7}
      .line {fill:none;stroke:#455a76;stroke-width:2.5;marker-end:url(#arrow)}
      .future-line {fill:none;stroke:#c47216;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#future-arrow)}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#fbfcfe"/>
  <text x="60" y="65" class="title">调度框架：接口层级与扩展边界</text>
  <text x="60" y="104" class="subtitle">调用方式兼容 · 单后端装配 · 整 case 共用 600 秒目标预算 · 官方与近似结果保留来源</text>

  <rect x="60" y="134" width="20" height="20" rx="4" fill="#526781"/>
  <text x="91" y="151" class="small">公共框架</text>
  <rect x="245" y="134" width="20" height="20" rx="4" fill="#2674af"/>
  <text x="276" y="151" class="small">已实现的 Q1 适配</text>
  <rect x="495" y="134" width="20" height="20" rx="4" fill="#fff5e8" stroke="#c47216" stroke-dasharray="4 3"/>
  <text x="526" y="151" class="small">未来扩展；当前不执行</text>

  <rect x="60" y="190" width="415" height="128" rx="16" class="q1"/>
  <text x="82" y="226" class="heading">现有 Q1 调用入口</text>
  <text x="82" y="257" class="code">q1.unified.api</text>
  <text x="82" y="287" class="body">solve_case / solve_file / CLI</text>

  <path d="M475 254 H525" class="line"/>
  <rect x="535" y="190" width="515" height="128" rx="16" class="public"/>
  <text x="558" y="226" class="heading">ProblemDefinition + registry</text>
  <text x="558" y="257" class="body">按问题标识和版本装配接口</text>
  <text x="558" y="287" class="body" font-weight="700">每次调用只选择一个后端</text>

  <rect x="1160" y="190" width="380" height="128" rx="16" class="future"/>
  <text x="1184" y="226" class="heading" style="fill:#95590d">未来 Q3 适配</text>
  <text x="1184" y="257" class="body">实现同一组协议后注册</text>
  <text x="1184" y="287" class="body" font-weight="700">仅预留位置，尚未接入</text>
  <path d="M1160 254 H1061" class="future-line"/>

  <path d="M792 318 V364" class="line"/>
  <rect x="60" y="376" width="1480" height="364" rx="20" fill="#f5f7fb" stroke="#9daec0" stroke-width="2"/>
  <text x="84" y="417" class="section">scheduling / 公共框架</text>
  <text x="1515" y="417" text-anchor="end" class="small">只依赖协议；不导入 Q1 算法</text>

  <rect x="88" y="446" width="620" height="92" rx="12" class="public"/>
  <text x="109" y="480" class="heading">api · budget · io</text>
  <text x="109" y="513" class="body">整 case 600 秒预算 / 进程监督 / 检查点输出</text>
  <path d="M708 492 H777" class="line"/>
  <rect x="789" y="446" width="721" height="92" rx="12" class="public"/>
  <text x="810" y="480" class="heading">engine · service</text>
  <text x="810" y="513" class="body">统一搜索、状态池、评估与来源记录</text>

  <text x="800" y="580" text-anchor="middle" class="small">通过 contracts 中的四组接口调用所选问题实现</text>
  <rect x="88" y="600" width="334" height="112" rx="12" class="public"/>
  <text x="108" y="635" class="heading">PlanSemantics</text>
  <text x="108" y="668" class="body">方案表示、合法性与目标</text>
  <text x="108" y="695" class="small">如何理解和比较一个方案</text>

  <rect x="451" y="600" width="334" height="112" rx="12" class="public"/>
  <text x="471" y="635" class="heading">ExecutionModel</text>
  <text x="471" y="668" class="body">图准备与真实评估</text>
  <text x="471" y="695" class="small">如何得到问题的真实结果</text>

  <rect x="814" y="600" width="334" height="112" rx="12" class="public"/>
  <text x="834" y="635" class="heading">PredictionModel</text>
  <text x="834" y="668" class="body">近似评分、校准与成本</text>
  <text x="834" y="695" class="small">如何快速预测与纠偏</text>

  <rect x="1177" y="600" width="334" height="112" rx="12" class="public"/>
  <text x="1197" y="635" class="heading">ProposalSet</text>
  <text x="1197" y="668" class="body">初始构造与改进候选</text>
  <text x="1197" y="695" class="small">如何产生下一批可选方案</text>

  <path d="M255 740 V790" class="line"/>
  <path d="M618 740 V790" class="line"/>
  <path d="M981 740 V790" class="line"/>
  <path d="M1344 740 V790" class="line"/>

  <rect x="60" y="802" width="1480" height="302" rx="20" fill="#edf7fd" stroke="#2674af" stroke-width="2"/>
  <text x="84" y="841" class="section">q1/unified/backend.py / 默认 Q1 适配</text>
  <text x="84" y="873" class="small">包装原有算法与官方接口；下方四列对应上方四组协议</text>

  <rect x="88" y="897" width="334" height="176" rx="12" class="q1-module"/>
  <text x="108" y="930" class="heading">Q1 方案语义</text>
  <text x="108" y="963" class="code">q1.plan</text>
  <text x="108" y="995" class="body">节点划分 / 核队列</text>
  <text x="108" y="1025" class="body">覆盖、无环与比较键</text>
  <text x="108" y="1053" class="small">不改变官方两字段方案格式</text>

  <rect x="451" y="897" width="334" height="176" rx="12" class="q1-module"/>
  <text x="471" y="930" class="heading">Q1 执行实现</text>
  <text x="471" y="963" class="code">model / graph / official</text>
  <text x="471" y="995" class="body">原有图模型与配置</text>
  <text x="471" y="1025" class="body">官方多核模拟与预分析</text>
  <text x="471" y="1053" class="small">官方附件保持原样</text>

  <rect x="814" y="897" width="334" height="176" rx="12" class="q1-module"/>
  <text x="834" y="930" class="heading">Q1 预测实现</text>
  <text x="834" y="963" class="code">improvement / features</text>
  <text x="834" y="995" class="body">局部 Pipe 与 DDR 近似</text>
  <text x="834" y="1025" class="body">在线残差与官方成本估计</text>
  <text x="834" y="1053" class="small">估计结果标注 approximate</text>

  <rect x="1177" y="897" width="334" height="176" rx="12" class="q1-module"/>
  <text x="1197" y="930" class="heading">Q1 候选实现</text>
  <text x="1197" y="963" class="code">construction / operators</text>
  <text x="1197" y="995" class="body">TaskGrowth 与结构构造</text>
  <text x="1197" y="1025" class="body">局部改进与共享调度</text>
  <text x="1197" y="1053" class="small">同一搜索内提案，不另开管线</text>

  <text x="60" y="1150" class="small">实线：当前调用关系　　橙色虚线：未来注册位置　　Q3 不参与当前 Q1 的搜索、评估或结果选择。</text>
  <text x="60" y="1179" class="small">接口字段、配置覆盖、缓存与版本隔离规则：docs/q1/interfaces.md；本图不表示 Q3 已完成迁移。</text>
</svg>
